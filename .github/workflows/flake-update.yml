name: Flake Update

# Weekly: update flake.lock, build Titan's system closure, then merge.
# Titan applies main at its nightly autoUpgrade (04:00). A failed build
# leaves the PR open and nothing reaches Titan; the `upgrade` skill reports it.
# Release branches (nixos-AA.MM) are pinned in flake.nix: this never crosses a major.

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 3:00 UTC
  workflow_dispatch: # Manual trigger

permissions: {}

# A manual run and the weekly one must not push the same branch at once.
concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # push the update branch, merge it
      pull-requests: write # open and merge the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the system closure
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update flake.lock
        run: nix flake update

      - name: Build Titan system
        run: nix build .#nixosConfigurations.titan.config.system.build.toplevel --no-link --print-build-logs

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(deps): update flake.lock"
          title: "chore(deps): update flake.lock"
          body: |
            Automated `nix flake update`, Titan system closure built successfully.

            Merged automatically; Titan applies it at the next nightly autoUpgrade (04:00).
          branch: chore/flake-update
          delete-branch: true

      - name: Merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
