name: Flake Update

# The weekly bot proposes the lock update. The PR gate proves it before automerge.
# App credentials are used only in the separate proposal job, never during Nix evaluation.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update the permitted inputs
        run: nix flake update

      - name: Upload the candidate lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1
          if-no-files-found: error

  propose:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the candidate lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-lock
          path: candidate

      - name: Verify and copy only the lockfile
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          candidate = Path("candidate/flake.lock")
          new = json.loads(candidate.read_text())
          if new.get("version") != 7 or "root" not in new.get("nodes", {}):
              raise SystemExit("Invalid flake lock format")
          # No kernel input is held back in this repository.
          Path("flake.lock").write_bytes(candidate.read_bytes())
          PYCODE

      - name: Mint a token scoped to this repository
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          # The trusted base is checked out by SHA (detached HEAD): name the target branch.
          base: main
          commit-message: "chore(deps): update flake.lock"
          title: "chore(deps): update flake.lock"
          body: "Weekly lock update. Automerge waits for the required gate on an up-to-date branch."
          branch: chore/flake-update
          delete-branch: true
          add-paths: flake.lock

      - name: Automerge only after required checks pass
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --auto --squash --delete-branch --repo "$GITHUB_REPOSITORY"
